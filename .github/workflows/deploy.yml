name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires the infra in terraform/ to already exist (terraform apply is a
# manual, one-time step — see terraform/README.md) and one repo secret:
#   AWS_DEPLOY_ROLE_ARN — the `github_actions_role_arn` Terraform output.
permissions:
  id-token: write # needed to assume the AWS role via OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: activity-tracker
  ECS_CLUSTER: activity-tracker-cluster

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Look up the load balancer's public URL
        id: alb
        run: |
          DNS=$(aws elbv2 describe-load-balancers \
            --names "${PROJECT_NAME}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)
          # /api, not the bare origin: the backend is only routed by the ALB
          # under /api/* (see terraform/alb.tf), to avoid colliding with a
          # frontend page of the same name as a bare backend route.
          echo "url=http://${DNS}/api" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/${PROJECT_NAME}-backend:${{ github.sha }}" \
                        -t "$REGISTRY/${PROJECT_NAME}-backend:latest" \
                        ./backend
          docker push "$REGISTRY/${PROJECT_NAME}-backend:${{ github.sha }}"
          docker push "$REGISTRY/${PROJECT_NAME}-backend:latest"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.alb.outputs.url }}" \
            -t "$REGISTRY/${PROJECT_NAME}-frontend:${{ github.sha }}" \
            -t "$REGISTRY/${PROJECT_NAME}-frontend:latest" \
            ./frontend
          docker push "$REGISTRY/${PROJECT_NAME}-frontend:${{ github.sha }}"
          docker push "$REGISTRY/${PROJECT_NAME}-frontend:latest"

      - name: Roll the ECS services
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" \
            --service "${PROJECT_NAME}-backend" --force-new-deployment
          aws ecs update-service --cluster "$ECS_CLUSTER" \
            --service "${PROJECT_NAME}-frontend" --force-new-deployment
